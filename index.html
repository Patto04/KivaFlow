<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KivaFlow · Laboratorio de Rutas de Picking</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <meta name="description"
    content="Simulador interactivo de rutas de picking y cuellos de botella en un almacén inteligente tipo Amazon (1800 nodos, 3515 pasillos) con BFS, Bellman-Ford y Edmonds-Karp." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=GFS+Didot&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="app-shell">
    <button id="mobile-menu-btn" class="mobile-menu-btn" type="button" aria-label="Abrir navegación"
      aria-expanded="false" aria-controls="sidebar">
      <span></span><span></span><span></span>
    </button>

    <aside id="sidebar" class="sidebar" aria-label="Navegación principal">
      <div class="sidebar-header">
        <a href="#inicio" class="brand" data-nav="inicio" title="KivaFlow · Inicio">
          <img class="brand-logo" src="assets/logo.png" alt="Logo KivaFlow" />
          <div class="brand-text">
            <span class="brand-title">Kiva<em>Flow</em></span>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Laboratorio</div>
        <a href="#inicio" class="nav-link active" data-nav="inicio" title="Inicio">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6.5h-5V21H4a1 1 0 0 1-1-1v-9.5Z" />
          </svg>
          <span>Inicio</span>
        </a>
        <a href="#explorar" class="nav-link" data-nav="explorar" title="Explorar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <polygon points="15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5 15.5 8.5" />
          </svg>
          <span>Explorar</span>
        </a>
        <a href="#comparar" class="nav-link" data-nav="comparar" title="Comparar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5M12 2v20" />
          </svg>
          <span>Comparar</span>
        </a>
        <a href="#simular" class="nav-link" data-nav="simular" title="Simulación">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="8" r="3" />
            <path d="M3 19a6 6 0 0 1 12 0" />
            <circle cx="17" cy="9" r="2.5" />
            <path d="M15 19a4.5 4.5 0 0 1 6-4.2" />
          </svg>
          <span>Simulación</span>
        </a>

        <div class="nav-section-label">Evidencia</div>
        <a href="#resultados" class="nav-link" data-nav="resultados" title="Resultados">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20V10m6 10V4m6 16v-7m4 7H2" />
          </svg>
          <span>Resultados</span>
        </a>
        <a href="#verificar" class="nav-link" data-nav="verificar" title="Verificación">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 12 2 2 4-4" />
            <path d="M12 3 4 6v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V6l-8-3Z" />
          </svg>
          <span>Verificación</span>
        </a>
        <a href="#acerca" class="nav-link" data-nav="acerca" title="Acerca">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 16v-4m0-4h.01" />
          </svg>
          <span>Acerca</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="status-card" title="Motor nativo JS · 1 800 nodos · 3 515 aristas">
          <div class="status-row">
            <span class="status-dot"></span>
            <strong>Motor nativo JS</strong>
          </div>
          <div class="status-meta">1 800 nodos · 3 515 aristas</div>
        </div>

        <button id="sidebar-collapse-btn" class="sidebar-collapse-btn" type="button" aria-label="Retraer barra lateral"
          aria-expanded="true" title="Retraer menú">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" ry="5" />
            <line x1="9" y1="3" x2="9" y2="21" />
            <path class="chevron" d="M16 9l-3 3 3 3" />
          </svg>
          <span class="collapse-label">Retraer menú</span>
        </button>
      </div>
    </aside>

    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <main id="app-main" class="main-content" tabindex="-1">
      <div class="skeleton-page" aria-busy="true" aria-label="Cargando KivaFlow">
        <div class="sk-header">
          <div class="sk sk-title"></div>
          <div class="sk sk-sub"></div>
        </div>
        <div class="grid-hero" style="margin-bottom:24px">
          <div class="card sk-box" style="min-height:360px">
            <div class="sk sk-line w-30"></div>
            <div class="sk sk-heading w-85"></div>
            <div class="sk sk-heading w-60"></div>
            <div class="sk sk-line w-90" style="margin-top:16px"></div>
            <div class="sk sk-line w-75"></div>
            <div class="row" style="margin-top:auto;padding-top:24px">
              <div class="sk sk-btn"></div>
              <div class="sk sk-btn"></div>
            </div>
          </div>
          <div class="card sk-box" style="min-height:360px">
            <div class="sk sk-line w-40"></div>
            <div class="sk sk-canvas"></div>
            <div class="sk sk-line w-100" style="height:28px;margin-top:12px"></div>
          </div>
        </div>
        <div class="grid-4">
          <div class="card kpi-1 sk-kpi">
            <div class="sk sk-line w-45"></div>
            <div class="sk sk-num"></div>
            <div class="sk sk-line w-80"></div>
          </div>
          <div class="card kpi-2 sk-kpi">
            <div class="sk sk-line w-45"></div>
            <div class="sk sk-num"></div>
            <div class="sk sk-line w-80"></div>
          </div>
          <div class="card kpi-3 sk-kpi">
            <div class="sk sk-line w-45"></div>
            <div class="sk sk-num"></div>
            <div class="sk sk-line w-80"></div>
          </div>
          <div class="card kpi-4 sk-kpi">
            <div class="sk sk-line w-45"></div>
            <div class="sk sk-num"></div>
            <div class="sk sk-line w-80"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="map-tooltip" class="map-tooltip" role="tooltip" hidden></div>

  <script src="data/dataset.js"></script>
  <script src="js/data.js"></script>
  <script src="js/algorithms.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
